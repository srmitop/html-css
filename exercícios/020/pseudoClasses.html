<head>

    <title>pseudo-classes</title>


<style>

    body{
        background-image: linear-gradient(to right,rgb(244, 169, 30),rgb(173, 120, 20))
    }    
        
    


    h1{
        font-size: 60px;
        text-align: center;
    }
div{

}

</head>
